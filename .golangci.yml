version: "2"

linters:
  enable:
    - bodyclose
    - errorlint
    - gosec
    - noctx
    - sqlclosecheck
    - unconvert
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - noctx
      - path: cmd/keygen/
        linters:
          - gosec
        text: G703
      - path: internal/mfa/totp\.go
        linters:
          - gosec
        text: G505

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/GoularteLB/auth-service
