services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no arquivo .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U auth -d auth"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?defina REDIS_PASSWORD no arquivo .env}", "--appendonly", "yes"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"

  migrate:
    build: .
    entrypoint: ["/app/migrate", "up"]
    environment:
      AUTH_DATABASE_URL: postgres://auth:${POSTGRES_PASSWORD}@postgres:5432/auth?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  auth:
    build: .
    environment:
      AUTH_ENV: ${AUTH_ENV:-development}
      AUTH_LOG_LEVEL: ${AUTH_LOG_LEVEL:-info}
      AUTH_DATABASE_URL: postgres://auth:${POSTGRES_PASSWORD}@postgres:5432/auth?sslmode=disable
      AUTH_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      AUTH_SMTP_URL: smtp://mailpit:1025
      AUTH_PUBLIC_URL: ${AUTH_PUBLIC_URL:-http://localhost:5173}
      AUTH_MFA_KEY: ${AUTH_MFA_KEY:-}
    ports:
      - "127.0.0.1:${AUTH_PORT:-8080}:8080"
      - "127.0.0.1:${AUTH_INTERNAL_PORT:-8081}:8081"
    depends_on:
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  redisdata:
